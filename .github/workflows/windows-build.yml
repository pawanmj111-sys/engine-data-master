name: Windows desktop build

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run unit tests
        run: bun run test
      - name: Run lint
        run: bun run lint
      - name: Build web app
        run: bun run build

  windows-exe:
    name: Build Windows installer and portable EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Windows EXEs
        run: bun run build:exe
      - name: Upload Windows EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EngineLab-Windows-EXE
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 30
